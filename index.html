<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>习 · 论语</title><style>body{margin:0;padding:24px 12px;background:light-dark(#e8e9e2,#191d18);font-family:system-ui}#ly-app nav{position:sticky;bottom:0}#ly-app main{min-height:520px}button:focus-visible,textarea:focus-visible{outline:3px solid #ae705e;outline-offset:3px}label{display:block}@media(max-width:460px){body{padding:0}#ly-app{max-width:none;border:0;border-radius:0;min-height:100dvh}} </style></head><body><style>
#ly-app{--paper:light-dark(#f8f5ee,#25251f);--ink:light-dark(#303b32,#e3e5dc);--muted:light-dark(#697065,#aab1a5);--line:light-dark(#deded2,#464c40);--accent:light-dark(#924536,#eba28f);--panel:light-dark(#eeeee3,#30372d);max-width:420px;margin:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:26px;overflow:hidden;font-family: system-ui,sans-serif}
#ly-app *{box-sizing:border-box}#ly-app header{padding:24px 24px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}#ly-app .brand{font-family:serif;letter-spacing:5px;font-size:22px}#ly-app .small{font-size:12px;color:var(--muted)}#ly-app main{padding:24px;min-height:500px}#ly-app h2{font-size:26px;font-weight:500;margin:8px 0 18px;font-family:serif}#ly-app h3{font-size:16px;font-weight:500;margin:0 0 12px}#ly-app p{line-height:1.8}#ly-app .quote{font-family:serif;font-size:24px;line-height:1.95;margin:18px 0}#ly-app .box{padding:20px;background:var(--panel);border-radius:14px;margin:18px 0}#ly-app button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:10px;padding:12px;min-height:44px}#ly-app button.primary{background:var(--ink);color:var(--paper);border:0;width:100%;margin-top:12px}#ly-app .row{display:flex;gap:10px;align-items:center;justify-content:space-between}#ly-app .list{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 0;display:flex;justify-content:space-between;gap:10px}#ly-app nav{display:flex;border-top:1px solid var(--line);padding:9px;background:var(--paper)}#ly-app nav button{flex:1;border:0;color:var(--muted);display:grid;justify-items:center;gap:5px;font-size:12px}#ly-app nav button[aria-current=page]{color:var(--accent);background:var(--panel)}#ly-app input{width:100%;padding:12px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px}#ly-app textarea{width:100%;min-height:115px;padding:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px}#ly-app .track{height:4px;background:var(--line);margin:12px 0}#ly-app .track span{display:block;height:100%;background:var(--accent)}#ly-app details{border-bottom:1px solid var(--line);padding:14px 0}#ly-app summary{cursor:pointer;padding:5px 0}#ly-app .accent{color:var(--accent)}#ly-app .note{white-space:pre-wrap;overflow-wrap:anywhere}#ly-app .choices{display:grid;gap:10px}#ly-app .choices button{text-align:left}
</style>
<div id="ly-app" aria-label="论语学习 App">
<header><span class="brand">习 · 论语</span><span class="small">每日十分钟，读懂一点</span></header>
<main id="ly-main"></main><div id="storage-status" class="small" style="padding:0 24px 14px" role="status"></div>
<nav aria-label="主导航"><button data-page="learn" aria-current="page">学习</button><button data-page="book">原典</button><button data-page="review">复习</button><button data-page="notes">笔记</button></nav>
</div>
<script>
(()=>{const root=document.getElementById('ly-app'),main=root.querySelector('main');const chapters=[{id:'1.1',title:'学与习',text:'子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”',words:'说：通“悦”，愉快。愠：恼怒。时习：按一定时候温习或实践所学。',meaning:'孔子说：学习后时常温习、实践，不也令人喜悦吗？有朋友从远方来，不也快乐吗？别人不了解自己却不恼怒，不也是君子的修养吗？',question:'“人不知而不愠”强调什么？',choices:['无论别人说什么都不回应','不因别人不了解自己而恼怒','不必让别人理解自己的想法'],answer:1},{id:'1.3',title:'言辞与仁',text:'子曰：“巧言令色，鲜矣仁！”',words:'巧言：花言巧语。令色：刻意讨好的脸色。鲜：少。',meaning:'孔子说：花言巧语、装出讨好神色的人，很少有仁德。',question:'这段话主要提醒我们留意什么？',choices:['所有善于表达的人都不可信','外在讨好不等于内在仁德','说话越少越有仁德'],answer:1},{id:'1.4',title:'每日自省',text:'曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”',words:'省：反省。忠：尽心竭力。信：诚实守信。传：老师传授的知识。',meaning:'曾子说：我每天反省自己：替别人办事是否尽心？与朋友交往是否诚信？老师传授的知识是否温习了？',question:'哪一项属于这段话的自省内容？',choices:['今天是否获得别人的赞美','与朋友交往是否诚实守信','学习是否比别人更快'],answer:1}].concat([{"id": "1.2", "title": "务本与孝弟", "text": "有子曰：“其为人也孝弟，而好犯上者，鲜矣；不好犯上，而好作乱者，未之有也。君子务本，本立而道生；孝弟也者，其为仁之本与？”", "words": "弟：通“悌”，敬爱兄长。务本：致力于根本。与：语气词。", "meaning": "有子认为，孝敬父母、敬爱兄长与秩序相联系，并将孝弟看作实践仁的根本。这体现了当时由家庭推及社会的伦理观，不宜直接等同于现代社会的全部规则。", "question": "“君子务本”中的“本”指什么？", "choices": ["事物的根本", "书本的数量", "个人的名声"], "answer": 0}, {"id": "1.5", "title": "敬事与爱人", "text": "子曰：“道千乘之国，敬事而信，节用而爱人，使民以时。”", "words": "道：治理。乘：古代兵车单位。以时：依照合适的时节。", "meaning": "治理有千辆兵车的国家，应认真办事、守信，节约用度、爱护人，役使民众要顾及农时。这里谈的是古代治国责任。", "question": "“使民以时”强调什么？", "choices": ["随时征用民力", "顾及适宜的时节", "只追求办事速度"], "answer": 1}, {"id": "1.6", "title": "行有余力", "text": "子曰：“弟子入则孝，出则弟，谨而信，泛爱众，而亲仁。行有余力，则以学文。”", "words": "弟子：年轻后辈。谨：谨慎。亲仁：亲近有仁德的人。文：文化典籍等学习内容。", "meaning": "年轻人在家孝敬父母，出外敬重长辈，谨慎守信，关爱众人、亲近仁者。做到这些还有余力，再学习文献知识。本章强调德行实践与学习的次序。", "question": "本章如何安排实践与学文？", "choices": ["只需学文", "不必学文", "先重视德行实践，有余力再学文"], "answer": 2}, {"id": "1.7", "title": "学在行动中", "text": "子夏曰：“贤贤易色；事父母，能竭其力；事君，能致其身；与朋友交，言而有信；虽曰未学，吾必谓之学已矣。”", "words": "贤贤：尊重贤者。易色：通常解作看重贤德而轻于美色，另有异解。致其身：尽身力。", "meaning": "子夏重视可见的品行：尊贤、尽心侍奉父母、尽力事君、交友守信。即使这样的人自称未学，他也认为其已有所学。事君属于古代政治语境。", "question": "子夏判断“学”的重要依据是什么？", "choices": ["自称读过多少书", "日常行为是否体现德行", "是否善于争论"], "answer": 1}, {"id": "1.8", "title": "过则勿惮改", "text": "子曰：“君子不重则不威，学则不固。主忠信，无友不如己者，过则勿惮改。”", "words": "重：庄重。固：此处常解为牢固。惮：畏惧。“无友不如己者”有不同解释。", "meaning": "本章通常理解为：君子须庄重，以忠信为主，谨慎选择朋友，有错不要害怕改正。交友一句不宜简单延伸为按地位高低筛选朋友。", "question": "“过则勿惮改”是什么意思？", "choices": ["有错不要怕改正", "只改小错", "有错先掩饰"], "answer": 0}, {"id": "1.9", "title": "慎终追远", "text": "曾子曰：“慎终追远，民德归厚矣。”", "words": "慎终：慎重办理丧事。追远：追念、祭祀远祖。厚：敦厚。", "meaning": "曾子认为，慎重对待亲人去世之事、追念先人，会使民众的风气趋于敦厚。这句话有丧祭礼俗的具体背景。", "question": "“慎终追远”的原有背景是什么？", "choices": ["预测未来", "赶超远方的人", "丧祭与追念先人"], "answer": 2}, {"id": "1.10", "title": "温良恭俭让", "text": "子禽问于子贡曰：“夫子至于是邦也，必闻其政，求之与？抑与之与？”子贡曰：“夫子温、良、恭、俭、让以得之。夫子之求之也，其诸异乎人之求之与？”", "words": "邦：诸侯国。抑：还是。俭：节制。其诸：表示推测的语气。", "meaning": "子禽问孔子何以总能听闻所在国家的政事。子贡把这归于孔子温和、善良、恭敬、节制、谦让的品格，认为他的求取方式与别人不同。", "question": "子贡主要用什么解释孔子能够闻政？", "choices": ["身份带来的强制权力", "温良恭俭让的品格", "秘密打探"], "answer": 1}, {"id": "1.11", "title": "志与行", "text": "子曰：“父在观其志，父没观其行。三年无改于父之道，可谓孝矣。”", "words": "没：去世。道：行事原则、做法。“三年”与传统丧制相关。", "meaning": "通常理解为：父亲在世时观察一个人的志向，去世后观察其行为；长期不轻改父亲的行事之道，被视为孝的表现。这有宗法与丧制背景，不能直接推为必须保留父辈的一切做法。", "question": "理解本章时需要结合什么？", "choices": ["传统家庭与丧制背景", "现代公司的考勤制度", "数学中的三年周期"], "answer": 0}, {"id": "1.12", "title": "和与礼", "text": "有子曰：“礼之用，和为贵；先王之道，斯为美；小大由之。有所不行，知和而和，不以礼节之，亦不可行也。”", "words": "和：和谐、协调。斯：这。节：节制、约束。", "meaning": "有子重视礼在实践中达成和谐，但也指出，只为和谐而和谐、不用礼来约束，同样行不通。理解时应把前后两层一起看。", "question": "本章是否主张无条件求和？", "choices": ["是，任何原则都可放弃", "只要求表面一致", "否，还需礼的约束"], "answer": 2}, {"id": "1.13", "title": "信与义", "text": "有子曰：“信近于义，言可复也；恭近于礼，远耻辱也。因不失其亲，亦可宗也。”", "words": "复：践履、兑现。因、亲、宗：末句解释有分歧，常解为依靠合适而可亲的人，便可有所尊奉。", "meaning": "承诺符合义，才可履行；恭敬合于礼，能远离耻辱。末句可理解为依靠的人选择得当，才值得尊奉；此处保留解释分歧。", "question": "为什么“信”还要与“义”相联系？", "choices": ["承诺也应符合正当原则", "承诺无需兑现", "只对熟人守信"], "answer": 0}, {"id": "1.14", "title": "敏事慎言", "text": "子曰：“君子食无求饱，居无求安，敏于事而慎于言，就有道而正焉，可谓好学也已。”", "words": "敏：勤勉、敏捷。就：接近。有道：有道德、有学问的人。正：匡正自己。", "meaning": "君子不把饮食居处的享受作为追求，办事勤勉、说话谨慎，向有道者请教以匡正自己，这可称为好学。并非要求忽视基本生活需要。", "question": "哪种行为符合本章的“好学”？", "choices": ["只收藏书籍", "勤于做事并向有道者求正", "只追求舒适"], "answer": 1}, {"id": "1.15", "title": "切磋琢磨", "text": "子贡曰：“贫而无谄，富而无骄，何如？”子曰：“可也。未若贫而乐，富而好礼者也。”子贡曰：“《诗》云：‘如切如磋，如琢如磨。’其斯之谓与？”子曰：“赐也，始可与言《诗》已矣！告诸往而知来者。”", "words": "谄：讨好、谄媚。赐：子贡的名。切磋琢磨：加工骨、象牙、玉、石的工序，此处引申为修养提升。“贫而乐”另有“贫而乐道”异文。", "meaning": "子贡问贫不谄、富不骄如何。孔子认可，又提出贫而能乐、富而好礼的进一步境界。子贡由此联想到《诗》，孔子赞许他能从已告知的道理推知新的意义。", "question": "孔子赞许子贡的哪种学习能力？", "choices": ["逐字重复", "只记结论", "由已知推知新意"], "answer": 2}, {"id": "1.16", "title": "知人", "text": "子曰：“不患人之不己知，患不知人也。”", "words": "患：忧虑。不己知：不了解自己。知人：了解别人。", "meaning": "孔子说，不要忧虑别人不了解自己，应忧虑自己不了解别人。重点在于把关注转回自己的认识能力。", "question": "本章把关注点转向哪里？", "choices": ["自己是否了解别人", "别人是否赞美自己", "如何使所有人知道自己"], "answer": 0}]).sort((a,b)=>Number(a.id.split(".")[1])-Number(b.id.split(".")[1]));let page='learn',index=0,done=new Set(),notes=[],draft='',step=0,drafts={};
const storageKey='lunyu-study-v1';let storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved){if(saved.version!==2){const old=[0,2,3];saved.done=(saved.done||[]).map(i=>old[i]).filter(i=>i!==undefined);saved.index=old[saved.index]||0}drafts=saved.drafts&&typeof saved.drafts==='object'?saved.drafts:{};done=new Set((saved.done||[]).filter(i=>Number.isInteger(i)&&i>=0&&i<chapters.length));notes=(saved.notes||[]).filter(n=>typeof n.text==='string'&&typeof n.id==='string');index=Number.isInteger(saved.index)&&saved.index>=0&&saved.index<chapters.length?saved.index:0;draft=typeof drafts[chapters[index].id]==='string'?drafts[chapters[index].id]:(typeof saved.draft==='string'?saved.draft:'')}}catch(e){storageOK=false}
function persist(){drafts[chapters[index].id]=draft;try{localStorage.setItem(storageKey,JSON.stringify({version:2,done:[...done],notes,index,draft,drafts}));storageOK=true}catch(e){storageOK=false}root.querySelector('#storage-status').textContent=storageOK?'首篇试用版 · 数据保存在此浏览器':'此浏览器无法保存，离开前请导出笔记'}
const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(p){page=p;root.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===p?'page':'false'));render()}function render(){let c=chapters[index];if(page==='learn'){main.innerHTML=`<div class="small">循序读经典 · 学而第一</div><h2>从「学」开始。</h2><p class="small">学而第一 · 16 章 · 完整首篇</p><div class="track"><span style="width:${done.size/chapters.length*100}%"></span></div><div class="row small"><span>已完成 ${done.size} / ${chapters.length} 节</span><span>按自己的节奏读</span></div><div class="box"><div class="small accent">${done.has(index)?'重读此章':'今日学习'} · ${c.id}</div><div class="quote">${c.title}</div><p>读原文，解字词，再用一道题检验理解。</p><button class="primary" data-action="lesson">${done.has(index)?'重读这一课 →':'开始这一课 →'}</button></div><h3>学习路线</h3>${chapters.map((v,i)=>`<button class="list" data-index="${i}"><span>${v.id}　${v.title}</span><span class="small">${done.has(i)?'已完成 ✓':'进入 →'}</span></button>`).join('')}`}
else if(page==='lesson'){main.innerHTML=`<button data-page="learn">← 返回学习</button><p class="small">学而第一 · ${c.id} · ${step===0?'阅读理解':'检验理解'}</p><h2>${c.title}</h2>${step===0?`<div class="quote">${c.text}</div><details open><summary>字词注释</summary><p>${c.words}</p></details><details><summary>白话理解</summary><p>${c.meaning}</p></details><p class="small">注释与白话为编写稿，待专业校订。</p><a class="small" href="https://zh.wikisource.org/w/index.php?title=論語/學而第一&amp;oldid=2058123" target="_blank" rel="noopener">原文校对来源 · 维基文库</a><button class="primary" data-action="quiz">读完了，检验理解 →</button>`:`<p>${c.question}</p><div class="choices">${c.choices.map((v,i)=>`<button data-answer="${i}">${v}</button>`).join('')}</div><p id="feedback" aria-live="polite"></p><button class="primary" id="finish" data-action="finish" hidden>完成本课</button>`}`}
else if(page==='book'){main.innerHTML=`<div class="small">原典 · 学而全篇</div><h2>学而第一</h2><p class="small">共 16 章，可搜索原文、标题与章号。</p><label for="book-search" class="small">查找章句</label><input id="book-search" type="search" placeholder="例如：君子、1.12"><p id="search-status" class="small" aria-live="polite"></p>${chapters.map((v,i)=>`<button class="list" data-index="${i}"><span><span class="small">${v.id} · ${v.title}</span><p>${v.text}</p></span><span>›</span></button>`).join('')}`}
else if(page==='review'){main.innerHTML=`<div class="small">温故而知新</div><h2>再读，另有所得。</h2><p>已学的章句会留在这里，随时回来检验理解。</p>${done.size?[...done].map(i=>`<button class="list" data-review="${i}"><span>${chapters[i].id}　${chapters[i].title}</span><span>复习 →</span></button>`).join(''):`<div class="box"><h3>从第一课开始</h3><p>完成一节课，就有一份可以回看的收获。</p><button class="primary" data-page="learn">去学习</button></div>`}`}
else if(page==='notes'){main.innerHTML=`<div class="small">留下自己的理解</div><div class="row"><h2>读书札记</h2><button data-action="export">导出笔记</button></div><label for="ly-note">关于 ${c.id}「${c.title}」</label><p><textarea id="ly-note" placeholder="这段话让我想到……">${escape(draft)}</textarea></p><button class="primary" data-action="save">保存心得</button><p id="note-status" class="small" aria-live="polite"></p>${notes.map(n=>`<div class="box"><div class="small">学而 ${n.id}</div><p class="note">${escape(n.text)}</p></div>`).join('')}`};persist();}
root.addEventListener('input',e=>{if(e.target.id==='book-search'){const q=e.target.value.trim();let count=0;main.querySelectorAll('[data-index]').forEach(b=>{const c=chapters[Number(b.dataset.index)];const match=(c.id+c.title+c.text).includes(q);b.hidden=!match;b.style.display=match?'':'none';if(match)count++});main.querySelector('#search-status').textContent=count?'找到 '+count+' 章':'没有找到相关章句';}if(e.target.id==='ly-note'){draft=e.target.value;persist()}});root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){show(b.dataset.page);return}if(b.dataset.index!==undefined){persist();index=Number(b.dataset.index);draft=drafts[chapters[index].id]||'';step=0;show('lesson');return}if(b.dataset.review!==undefined){persist();index=Number(b.dataset.review);draft=drafts[chapters[index].id]||'';step=1;show('lesson');return}if(b.dataset.answer!==undefined){const correct=Number(b.dataset.answer)===chapters[index].answer;main.querySelector('#feedback').textContent=correct?'理解正确。你也可以在笔记中写下自己的想法。':'再想一想：关注原文表达的具体含义，避免扩大成绝对判断。';main.querySelector('#finish').hidden=!correct;return}switch(b.dataset.action){case'export':{const text=['# 我的论语札记',...notes.map(n=>'## 学而 '+n.id+'\n\n'+n.text),...(draft.trim()?['## 未保存草稿 · 学而 '+chapters[index].id+'\n\n'+draft]:[])].join('\n\n');const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='论语札记.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}case'lesson':step=0;show('lesson');break;case'quiz':step=1;render();break;case'finish':done.add(index);persist();show('notes');break;case'save':if(!draft.trim()){main.querySelector('#note-status').textContent='先写下一点想法吧。';return}notes.unshift({id:chapters[index].id,text:draft.trim()});draft='';render();main.querySelector('#note-status').textContent=storageOK?'已保存，下次打开可继续查看。':'本地保存失败，请导出笔记。';break}});render();})();
</script>
</body></html>
